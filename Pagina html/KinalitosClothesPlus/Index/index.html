<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.C - Login</title>
    <link rel="icon" type="image/x-icon" href="../Images/Logo_K.C.png">
    <link rel="stylesheet" href="../Styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-icons@1.13.12/iconfont/material-icons.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">K<span>C</span></div>
        </div>
    </nav>

    <section>
        <div class="container">
            <div class="segundo_contenedor">
                <div class="informacion">
                    <span class="line"></span>
                    <h2>Bienvenido a <br><span>Kinalitos Clothes</span></h2>
                    <p>Encuentra toda tu ropa a buenos precios</p>
                    <a href="https://wa.link/cp8m9x" class="btnContacto">Contáctanos</a>
                    <div class="redes-sociales">
                        <a href="https://www.facebook.com/jefry.yuman?locale=es_LA"><i
                                class="fa-brands fa-facebook-f"></i></a>
                        <a href="https://www.instagram.com/andrexd_34/"><i class="fa-brands fa-instagram"></i></a>
                        <a href="https://discord.gg/K5C57rwJGM"><i class="fa-brands fa-discord"></i></a>
                    </div>
                </div>

                <div class="login">
                    <div class="form">
                        <div class="text-center">
                            <h6><span>Log in </span> <span>Sign up</span></h6>
                            <input type="checkbox" class="checkbox" id="reg-log">
                            <label for="reg-log"></label>
                            <div class="card-3d-wrap">
                                <div class="card-3d-wrapper">
                                    <!-- Login -->
                                    <div class="card-front">
                                        <div class="center-wrap">
                                            <h4 class="heading">Inicio de Sesión</h4>
                                            <div class="form-group">
                                                <input type="email" class="form-style" placeholder="Email"
                                                    autocomplete="off">
                                                <i class="input-icon material-icons">alternate_email</i>
                                            </div>
                                            <div class="form-group">
                                                <input type="password" class="form-style" placeholder="Contraseña"
                                                    autocomplete="off">
                                                <i class="input-icon material-icons">lock</i>
                                            </div>
                                            <a href="#" class="btnIniciar">Entrar</a>
                                            <p class="text-center"><a href="#" class="link">¿Olvidaste tu contraseña?</a></p>
                                        </div>
                                    </div>
                                    
                                    <!-- Registro -->
                                    <div class="card-back">
                                        <div class="center-wrap">
                                            <h4 class="heading">Registrarse</h4>
                                            <div class="form-group">
                                                <input type="text" class="form-style" placeholder="Usuario"
                                                    autocomplete="off">
                                                <i class="input-icon material-icons">perm_identity</i>
                                            </div>
                                            <div class="form-group">
                                                <input type="email" class="form-style" placeholder="Email"
                                                    autocomplete="off">
                                                <i class="input-icon material-icons">alternate_email</i>
                                            </div>
                                            <div class="form-group">
                                                <input type="password" class="form-style" placeholder="Contraseña"
                                                    autocomplete="off">
                                                <i class="input-icon material-icons">lock</i>
                                            </div>
                                            <a href="#" class="btnRegistrar">Registrarme</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </section>

    <script>
        // Botón de registro
        const btnRegistrar = document.querySelector('.btnRegistrar');
        btnRegistrar.addEventListener('click', function (e) {
            e.preventDefault();
            const name = document.querySelector('.card-back input[type="text"]').value.trim();
            const email = document.querySelector('.card-back input[type="email"]').value.trim();
            const password = document.querySelector('.card-back input[type="password"]').value.trim();

            if (!name || !email || !password) {
                alert('Por favor completa todos los campos.');
                return;
            }

            let users = JSON.parse(localStorage.getItem('users')) || [];

            const exists = users.some(user => user.email === email);
            if (exists) {
                alert('Este correo ya está registrado.');
                return;
            }

            users.push({ name, email, password });
            localStorage.setItem('users', JSON.stringify(users));
            alert('¡Registro exitoso! Ahora puedes iniciar sesión.');

            // Cambiar a login
            document.querySelector('#reg-log').checked = false;
        });

        // Botón de inicio de sesión
        const btnIniciar = document.querySelector('.btnIniciar');
        btnIniciar.addEventListener('click', function (e) {
            e.preventDefault();
            const email = document.querySelector('.card-front input[type="email"]').value.trim();
            const password = document.querySelector('.card-front input[type="password"]').value.trim();

            if (!email || !password) {
                alert('Por favor ingresa tu correo y contraseña.');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users')) || [];

            const validUser = users.find(user => user.email === email && user.password === password);

            if (validUser) {
                alert(`Bienvenido, ${validUser.name}!`);
                window.location.href = 'menu.html';
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        });
    </script>

</body>
</html>
